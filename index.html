<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frolic</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: Georgia, serif; background: #c8e6ff; }
  #game, #game canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .hidden { display: none !important; }
  #title {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; background: rgba(255,255,255,0.88); border-radius: 24px;
    padding: 36px 52px; z-index: 5; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }
  #title h1 { margin: 0 0 10px; color: #3a6b2f; font-size: 44px; }
  #title p { margin: 0 0 22px; color: #5a2a4a; font-size: 17px; line-height: 1.5; }
  .bigbtn {
    font-size: 24px; padding: 16px 36px; border-radius: 16px;
    border: 3px solid #3a6b2f; background: #fff; color: #3a6b2f; cursor: pointer;
    min-height: 64px; margin: 6px;
  }
  .bigbtn:hover { background: #f0f7e8; }
  .opt { display: block; margin: 12px 0; font-size: 18px; color: #3a6b2f; cursor: pointer; user-select: none; }
  .opt input { width: 20px; height: 20px; margin-right: 10px; vertical-align: middle; }
  #btnPause {
    position: fixed; top: 18px; right: 18px; z-index: 5;
    font-size: 18px; padding: 12px 22px; min-height: auto;
  }
  #pause {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.94); border-radius: 24px; padding: 36px 52px;
    text-align: center; z-index: 6; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  #pause.open { display: block; }
  #pause h2 { margin: 0 0 18px; color: #3a6b2f; }
  .hint { margin-top: 20px; color: #5a2a4a; font-size: 15px; }
  #webgl-fallback { position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    background: #f7f3ea; color: #5a2a4a; z-index: 20; font-size: 20px; padding: 40px; }
  #webgl-fallback.visible { display: grid; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="game"></div>

<div id="title">
  <h1>🌾 Frolic</h1>
  <p>Wander the meadow. No goal, no hurry.<br>
     Hold <strong>LEFT</strong> / <strong>RIGHT</strong> to turn · <strong>SPACE</strong> to jog · <strong>ESC</strong> to pause.</p>
  <label class="opt" for="optVoice"><input type="checkbox" id="optVoice"> Voice announcements</label>
  <label class="opt" for="optButtons"><input type="checkbox" id="optButtons"> Show steering buttons</label>
  <button id="btnStart" class="bigbtn" type="button">Start walking</button>
</div>

<button id="btnPause" class="bigbtn hidden" type="button">Pause</button>

<div id="pause">
  <h2>Paused</h2>
  <button id="btnResume" class="bigbtn" type="button">Resume</button>
  <button id="btnSound" class="bigbtn" type="button">Sound on / off</button>
  <button id="btnQuit" class="bigbtn" type="button">Quit to title</button>
  <p class="hint">Space = jog · hold Return / Esc = pause</p>
</div>

<div id="webgl-fallback" role="alert">
  <p>This browser can't start WebGL, so the meadow can't be drawn.<br>
     Try a current version of Chrome, Firefox, or Safari.</p>
</div>

<script type="module" src="./src/main.js?v=14"></script>
</body>
</html>
